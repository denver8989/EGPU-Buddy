<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EGPU Buddy presentations</title><style>body{margin:0;background:#070e18;color:#eef5fb;font:17px system-ui}main{max-width:1600px;margin:auto;padding:24px}a{color:#65d5ff}iframe{display:block;width:100%;height:1300px;border:0}section{scroll-margin-top:20px;margin-top:36px;border-top:1px solid #35516a;padding-top:20px}p{line-height:1.6;color:#acc2d4}select{font:inherit;padding:10px;background:#15283b;color:#eef5fb;border:1px solid #35516a;border-radius:6px}</style><main><h1>EGPU Buddy presentations</h1><p>App Author voice plays by default. Choose the helmet or radio host presentation for two different styles of daft commentary.</p><p><a href="#egpu-buddy">EGPU Buddy</a> · <a href="#nv-gpu-buddy">NV GPU Buddy</a></p><label>Narration voice <select id="voice-choice" aria-label="Narration voice"><option value="natural" selected>App Author voice</option><option value="helmet">Helmet voice daft presentation</option><option value="radio">Radio host daft presentation</option></select></label> <label>Background music <select id="music-choice" aria-label="Background music"></select></label><section id="egpu-buddy"><h2>EGPU Buddy</h2><iframe id="egpu" src="egpu/index.html?voices=helmet-v2-07" allow="autoplay; fullscreen" title="EGPU Buddy presentation"></iframe></section><section id="nv-gpu-buddy"><h2>NV GPU Buddy</h2><iframe id="nv" src="nv/index.html?voices=helmet-v2-07" allow="autoplay; fullscreen" title="NV GPU Buddy presentation"></iframe></section></main><script>
const options=[{"key": "scifi", "label": "SciFi — Bensound"}, {"key": "retro", "label": "Retro Chiptune Adventure — Nick Panek"}, {"key": "swing", "label": "Night Walk — Electro Swing"}, {"key": "gorila", "label": "Gorila — Alex MakeMusic"}, {"key": "ultraviolet", "label": "Ultraviolet — S Deion"}, {"key": "upbeat", "label": "Fun Upbeat — Jonas Blakewood"}],sel=document.getElementById('music-choice');let current='scifi';try{current=localStorage.getItem('egpu-helmet-music')||current}catch{};for(const o of options){let v=document.createElement('option');v.value=o.key;v.textContent=o.label;sel.append(v)}sel.value=current;let latest=0;const readyFrames=new Set();
function music(value){sel.value=value;try{localStorage.setItem('egpu-helmet-music',value)}catch{}for(const key of ['egpu','nv'])document.getElementById(key).contentWindow.postMessage({type:'helmet-music',value},'*')}
sel.onchange=()=>music(sel.value);const voices=document.getElementById('voice-choice');function changeVoice(value){voices.value=value;for(const key of ['egpu','nv'])document.getElementById(key).contentWindow.postMessage({type:'presentation-voice',value},'*')}voices.onchange=()=>changeVoice(voices.value);
window.addEventListener('message',e=>{const data=e.data;if(!data||!['helmet-play','helmet-music','helmet-height','presentation-voice'].includes(data.type))return;const key=['egpu','nv'].find(k=>e.source===document.getElementById(k).contentWindow);if(!key)return;if(data.type==='presentation-voice'){changeVoice(data.value);return}if(data.type==='helmet-music'){music(data.value);return}if(data.type==='helmet-height'){document.getElementById(key).style.height=Math.max(650,Math.min(2200,data.height))+'px';if(!readyFrames.has(key)){readyFrames.add(key);document.getElementById(key).contentWindow.postMessage({type:'presentation-voice',value:voices.value},'*');document.getElementById(key).contentWindow.postMessage({type:'helmet-music',value:sel.value},'*')}return}if(data.time<latest)return;latest=data.time;for(const other of ['egpu','nv'])if(other!==key)document.getElementById(other).contentWindow.postMessage({type:'helmet-pause',time:data.time},'*')});
</script></html>
