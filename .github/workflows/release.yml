# Build and publish the release for the version in VERSION — runnable from the GitHub app, no PC needed.
# Actions tab -> "Publish release" -> Run workflow. It refuses if that version is already released.
# The prebuilt gamescope is not in git (binary), so it is taken from the newest published release's tarball.
name: Publish release
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the version is new
        run: |
          # only master is released: a test branch (e.g. update-resilience) must never be published by picking it here
          [ "$GITHUB_REF_NAME" = master ] || { echo "::error::Releases are published from master only (this run is on $GITHUB_REF_NAME)."; exit 1; }
          VER=$(cat VERSION)
          echo "Publishing v$VER"
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "::error::v$VER is already released. Bump VERSION and add a RELEASE-NOTES.md section first."; exit 1
          fi
          python3 release-notes-for.py "$VER" RELEASE-NOTES.md > /dev/null

      - name: Take the prebuilt gamescope from the latest release
        run: |
          PREV=$(gh release view --json tagName --jq .tagName)
          echo "prebuilt from $PREV"
          mkdir -p /tmp/prev
          gh release download "$PREV" --pattern 'SteamOS-EGPU-Buddy-*.tar.gz' --dir /tmp/prev
          tar -xzf /tmp/prev/SteamOS-EGPU-Buddy-*.tar.gz -C /tmp/prev
          cp -a /tmp/prev/SteamOS-EGPU-Buddy-*/prebuilt .
          test -x prebuilt/gamescope-gbm/usr/bin/gamescope

      - name: Bazzite QML runner (built once in a Fedora container, then carried forward like the others)
        # The Bazzite gamescope is NOT built here: the fix is built into whatever gamescope version the device has, on the
        # device (egpu-gamescope-repair); the release carries the build for the current Bazzite, made with
        # packaging/gamescope-gbm/build-bazzite.sh <out> <OGC tag>.
        run: |
          FED=44
          # Bazzite gamescope with the fix, for the version the current Bazzite ships (BASE-TAG): built here only when the
          # previous release did not carry it; any other version is built on the device. A failure never blocks a release.
          BT=$(cat packaging/gamescope-gbm/bazzite/BASE-TAG)
          if [ "$(cat prebuilt/bazzite-gamescope-gbm/BUILT-FROM 2>/dev/null)" != "$BT" ]; then
            mkdir -p /tmp/bz
            if docker run --rm -v "$PWD/packaging/gamescope-gbm":/gs:ro -v /tmp/bz:/out fedora:$FED bash /gs/build-bazzite.sh /out "$BT"; then
              sudo rm -rf prebuilt/bazzite-gamescope-gbm; sudo cp -a /tmp/bz prebuilt/bazzite-gamescope-gbm; sudo chown -R "$(id -u):$(id -g)" prebuilt
            else echo "::warning::the Bazzite gamescope build failed; devices build it on install"; fi
          fi
          cat prebuilt/bazzite-gamescope-gbm/BUILT-FROM 2>/dev/null || true
          # the desktop app's QML runner for Bazzite (Fedora has Qt's qml tool only in a -devel package): small, same rules
          QWANT="fedora-$FED $(cat packaging/bazzite/qml-runner/main.cpp packaging/bazzite/qml-runner/build.sh | sha256sum | cut -c1-16)"
          if [ "$(cat prebuilt/bazzite-qml-runner/BUILD-ID 2>/dev/null)" != "$QWANT" ]; then
            mkdir -p /tmp/qr
            if docker run --rm -v "$PWD/packaging/bazzite/qml-runner":/q:ro -v /tmp/qr:/out fedora:$FED bash /q/build.sh /out; then
              sudo rm -rf prebuilt/bazzite-qml-runner; sudo cp -a /tmp/qr prebuilt/bazzite-qml-runner; echo "$QWANT" | sudo tee prebuilt/bazzite-qml-runner/BUILD-ID >/dev/null
              sudo chown -R "$(id -u):$(id -g)" prebuilt
            else echo "::warning::the Bazzite QML runner build failed; this release ships $(cat prebuilt/bazzite-qml-runner/BUILD-ID 2>/dev/null || echo none)"; fi
          fi

      - name: Build
        run: ./build-release.sh

      - name: Check the artifacts before publishing
        run: |
          VER=$(cat VERSION)
          test -s "dist/SteamOS-EGPU-Buddy-$VER.tar.gz"
          test -s "dist/SteamOS-EGPU-Buddy-$VER.run"
          unzip -l "dist/EGPU-Buddy-Decky-$VER.zip" | grep -q "payload/SteamOS-EGPU-Buddy-$VER.tar.gz"
          unzip -l "dist/EGPU-Buddy-Decky-$VER.zip" | grep -q "EGPU-Buddy/dist/index.js"
          tar -tzf "dist/SteamOS-EGPU-Buddy-$VER.tar.gz" | grep -q "prebuilt/gamescope-gbm/usr/bin/gamescope$"
          cat dist/SHA256SUMS

      - name: Publish
        run: |
          VER=$(cat VERSION); NAME="SteamOS-EGPU-Buddy-$VER"
          python3 release-notes-for.py "$VER" RELEASE-NOTES.md > "dist/NOTES-$VER.md"
          gh release create "v$VER" --target "$GITHUB_SHA" \
            "dist/$NAME.run" "dist/$NAME.tar.gz" "dist/EGPU-Buddy-Decky-$VER.zip" dist/SHA256SUMS get-egpu-buddy.sh \
            --title "SteamOS EGPU Buddy $VER" --notes-file "dist/NOTES-$VER.md"
